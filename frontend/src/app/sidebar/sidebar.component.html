<aside class="sidebar" aria-label="Workspace navigation">
  <a class="sidebar-brand" routerLink="/dashboard" aria-label="G.O.A.T. Platforms home">
    <svg class="brand-glyph" viewBox="0 0 36 36" fill="none" aria-hidden="true">
      <path
        d="M9 27V15m9 12V9m9 18V3"
        stroke="currentColor"
        stroke-width="5"
        stroke-linecap="round"
      />
      <path
        d="M7 33h23"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity=".5"
      />
    </svg>
    <span>G.O.A.T.<small>PLATFORMS</small></span>
  </a>
  <button type="button" class="mobile-signout" (click)="logout()" aria-label="Sign out">
    <svg
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path d="M8 4H4v12h4m4-10 4 4-4 4m-5-4h9" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <p class="nav-caption">Your workspace</p>
  <nav class="sidebar-nav" aria-label="Main navigation">
    @for (item of navItems(); track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="item.label"
      >
        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @switch (item.route) {
            @case ('/dashboard') {
              <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5" />
              <rect x="14" y="3.5" width="6.5" height="10.5" rx="1.5" />
              <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5" />
              <rect x="14" y="18" width="6.5" height="2.5" rx="1" />
            }
            @case ('/analyst') {
              <path d="M4 4v16h16M9 15v-4m5 4V7m5 8v-6" />
              <path d="m8 7 5-4 6 1" opacity=".4" />
            }
            @case ('/operations') {
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m15.5 15.5 5 5M8 10.5h5m-2.5-2.5v5" />
            }
          }
        </svg>
        <span class="nav-label">{{ item.label }}</span
        ><span class="nav-arrow" aria-hidden="true">↗</span>
      </a>
    }
  </nav>
  <div class="sidebar-note" aria-hidden="true">
    <span class="note-orbit"></span>
    <p>A little more clarity.<br />A lot more perspective.</p>
    <span class="note-rule"></span>
  </div>
  <div class="sidebar-footer">
    <app-theme-toggle [inverse]="true" />
    <app-motion-toggle [inverse]="true" />
    <div class="user-info">
      <div class="user-avatar">{{ userInitial() }}</div>
      <div class="user-details">
        <p class="user-name">{{ userName() }}</p>
        <p class="user-status">Your account</p>
      </div>
    </div>
    <button type="button" (click)="logout()" class="logout-button">
      <svg
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        aria-hidden="true"
      >
        <path
          d="M8 4H4v12h4m4-10 4 4-4 4m-5-4h9"
          stroke-linecap="round"
          stroke-linejoin="round"
        /></svg
      >Sign out
    </button>
  </div>
</aside>
