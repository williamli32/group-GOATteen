<svg viewBox="0 0 600 470" fill="none" focusable="false" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient
      [attr.id]="id + '-ribbon'"
      x1="154"
      y1="112"
      x2="411"
      y2="364"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#f9ffe7" />
      <stop offset=".12" stop-color="#e3f2c9" />
      <stop offset=".26" stop-color="#b4d6aa" />
      <stop offset=".4" stop-color="#e6f1c3" />
      <stop offset=".49" stop-color="#fcffe8" />
      <stop offset=".55" stop-color="#b7d4a1" />
      <stop offset=".64" stop-color="#3d8568" />
      <stop offset=".74" stop-color="#67a990" />
      <stop offset=".87" stop-color="#a4cfb1" />
      <stop offset="1" stop-color="#e9f7d3" />
    </linearGradient>
    <linearGradient
      [attr.id]="id + '-gold'"
      x1="154"
      y1="182"
      x2="438"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#fff5d9" />
      <stop offset=".12" stop-color="#debd78" />
      <stop offset=".28" stop-color="#9c7941" />
      <stop offset=".4" stop-color="#d8bb79" />
      <stop offset=".48" stop-color="#fff0c6" />
      <stop offset=".52" stop-color="#fff8e3" />
      <stop offset=".61" stop-color="#c6a461" />
      <stop offset=".74" stop-color="#94713e" />
      <stop offset=".86" stop-color="#e1c38c" />
      <stop offset="1" stop-color="#967443" />
    </linearGradient>
    <linearGradient
      [attr.id]="id + '-edge'"
      x1="204"
      y1="92"
      x2="415"
      y2="380"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ffffef" stop-opacity=".95" />
      <stop offset=".35" stop-color="#eaffd6" stop-opacity=".3" />
      <stop offset=".61" stop-color="#183f30" stop-opacity=".65" />
      <stop offset="1" stop-color="#efffda" stop-opacity=".8" />
    </linearGradient>
    <radialGradient [attr.id]="id + '-core'" cx=".36" cy=".28" r=".82">
      <stop stop-color="#7bc49b" />
      <stop offset=".28" stop-color="#4e9874" />
      <stop offset=".6" stop-color="#286247" />
      <stop offset="1" stop-color="#173d30" />
    </radialGradient>
    <radialGradient [attr.id]="id + '-core-light'" cx=".25" cy=".12" r=".85">
      <stop stop-color="#eaffd9" stop-opacity=".22" />
      <stop offset=".42" stop-color="#eaffd9" stop-opacity=".03" />
      <stop offset="1" stop-color="#eaffd9" stop-opacity="0" />
    </radialGradient>
    <radialGradient [attr.id]="id + '-glow'">
      <stop stop-color="#9dc793" stop-opacity=".4" />
      <stop offset=".55" stop-color="#8fc8a3" stop-opacity=".13" />
      <stop offset="1" stop-color="#79b894" stop-opacity="0" />
    </radialGradient>
    <radialGradient [attr.id]="id + '-pearl'" cx=".3" cy=".25" r=".9">
      <stop stop-color="#fffff5" />
      <stop offset=".18" stop-color="#f5ffdd" />
      <stop offset=".42" stop-color="#cbe5af" />
      <stop offset=".72" stop-color="#7cb58b" />
      <stop offset="1" stop-color="#3f755c" />
    </radialGradient>
    <radialGradient [attr.id]="id + '-shadow'">
      <stop stop-color="#071b13" stop-opacity=".9" />
      <stop offset=".45" stop-color="#071b13" stop-opacity=".6" />
      <stop offset="1" stop-color="#071b13" stop-opacity="0" />
    </radialGradient>
    <linearGradient [attr.id]="id + '-sheen'" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5ffdf" stop-opacity="0" />
      <stop offset=".2" stop-color="#f5ffdf" stop-opacity=".03" />
      <stop offset=".46" stop-color="#f5ffdf" stop-opacity=".32" />
      <stop offset=".54" stop-color="#f5ffdf" stop-opacity=".32" />
      <stop offset=".8" stop-color="#f5ffdf" stop-opacity=".03" />
      <stop offset="1" stop-color="#f5ffdf" stop-opacity="0" />
    </linearGradient>
    <clipPath [attr.id]="id + '-core-clip'"><circle cx="300" cy="233" r="64" /></clipPath>
  </defs>

  <circle class="ambient-glow" cx="300" cy="237" r="228" [attr.fill]="'url(#' + id + '-glow)'" />
  <g class="orbital-grid" stroke="currentColor" stroke-width=".7" opacity=".23">
    <path d="M53 237h494M300 20v434" stroke-dasharray="3 10" />
    <path d="M130 66l340 342M130 408 470 66" opacity=".35" />
    <circle cx="300" cy="237" r="184" />
    <g class="grid-rotor">
      <circle cx="300" cy="237" r="213" stroke-dasharray="2 9" />
      <path
        d="M300 24a213 213 0 0 1 106.5 28.5"
        stroke="#b9d6a9"
        stroke-width="2"
        stroke-linecap="round"
      />
      <circle cx="300" cy="24" r="3" fill="#bdd9aa" stroke="none" />
      <circle cx="300" cy="450" r="3" fill="#bdd9aa" stroke="none" />
    </g>
  </g>

  <g class="orbit-track" transform="rotate(-22 300 237)">
    <path [attr.d]="orbit" stroke="currentColor" stroke-width="1" opacity=".5" />
    <path
      class="orbit-comet"
      [attr.d]="orbit"
      pathLength="100"
      stroke="#d9edb9"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="9 91"
    />
    <path
      class="orbit-comet orbit-comet-gold"
      [attr.d]="orbit"
      pathLength="100"
      stroke="#d3b579"
      stroke-width="2"
      stroke-linecap="round"
      stroke-dasharray="4 96"
    />
    <g class="orbit-satellite" [style.offset-path]="orbitMotionPath">
      <circle r="13" fill="#cde8b6" opacity=".16" />
      <circle r="6" [attr.fill]="'url(#' + id + '-pearl)'" stroke="#efffda" stroke-width=".7" />
    </g>
    <g class="orbit-satellite orbit-satellite-gold" [style.offset-path]="orbitMotionPath">
      <circle r="10" fill="#e7c890" opacity=".14" />
      <circle r="4" fill="#e7c890" stroke="#fff0c9" stroke-width=".7" />
    </g>
  </g>

  <ellipse
    class="sculpture-shadow"
    cx="303"
    cy="407"
    rx="109"
    ry="14"
    [attr.fill]="'url(#' + id + '-shadow)'"
    opacity=".14"
  />
  <g class="flow-sculpture">
    <ellipse
      cx="300"
      cy="235"
      rx="95"
      ry="146"
      transform="rotate(39 300 235)"
      stroke="#0b3023"
      stroke-width="55"
      opacity=".14"
    />
    <ellipse
      cx="300"
      cy="229"
      rx="95"
      ry="146"
      transform="rotate(39 300 229)"
      [attr.stroke]="'url(#' + id + '-ribbon)'"
      stroke-width="47"
    />
    <ellipse
      cx="300"
      cy="229"
      rx="114"
      ry="164"
      transform="rotate(39 300 229)"
      [attr.stroke]="'url(#' + id + '-edge)'"
      stroke-width="1"
    />

    <circle
      cx="300"
      cy="233"
      r="65"
      [attr.fill]="'url(#' + id + '-core)'"
      stroke="#bce6c0"
      stroke-opacity=".5"
    />
    <circle cx="300" cy="233" r="64" [attr.fill]="'url(#' + id + '-core-light)'" />
    <circle
      cx="300"
      cy="233"
      r="61.5"
      [attr.stroke]="'url(#' + id + '-edge)'"
      stroke-width=".65"
      opacity=".7"
    />
    <path d="M248 217a55 55 0 0 1 76-34" stroke="#ecffdc" stroke-width="1" opacity=".35" />
    <g [attr.clip-path]="'url(#' + id + '-core-clip)'">
      <path
        class="core-sheen"
        d="M190 150h52l126 170h-52Z"
        [attr.fill]="'url(#' + id + '-sheen)'"
      />
    </g>
    <g stroke="#def0c5" stroke-width="7" stroke-linecap="round">
      <path class="core-bar" d="M278 250v-23" />
      <path class="core-bar core-bar-middle" d="M300 250v-42" />
      <path class="core-bar core-bar-high" d="M322 250v-61" />
      <path d="m278 215 22-18 22-20" stroke-width="2" stroke-opacity=".5" />
    </g>

    <g class="gold-ring">
      <ellipse
        cx="301"
        cy="237"
        rx="159"
        ry="72"
        transform="rotate(-26 301 237)"
        stroke="#493c23"
        stroke-width="17"
        stroke-opacity=".55"
      />
      <ellipse
        cx="301"
        cy="237"
        rx="159"
        ry="72"
        transform="rotate(-26 301 237)"
        [attr.stroke]="'url(#' + id + '-gold)'"
        stroke-width="15"
      />
      <ellipse
        cx="301"
        cy="237"
        rx="159"
        ry="72"
        transform="rotate(-26 301 237)"
        stroke="#fff5db"
        stroke-width="1.2"
        stroke-dasharray="24 76"
        stroke-dashoffset="-12"
        pathLength="100"
        stroke-linecap="round"
        stroke-opacity=".7"
      />
      <ellipse
        cx="301"
        cy="237"
        rx="159"
        ry="65"
        transform="rotate(-26 301 237)"
        stroke="#fff0d4"
        stroke-opacity=".5"
        stroke-width=".9"
      />
    </g>
    <path
      d="M226 349C134 310 155 175 258 119"
      stroke="#235a43"
      stroke-opacity=".45"
      stroke-width="49"
      stroke-linecap="round"
    />
    <path
      d="M226 349C134 310 155 175 258 119"
      [attr.stroke]="'url(#' + id + '-ribbon)'"
      stroke-width="47"
      stroke-linecap="round"
    />
    <path
      d="M218 357C126 304 146 173 249 112"
      stroke="#e7f7d0"
      stroke-width="1.5"
      stroke-opacity=".75"
    />
    <path
      d="M235 330C173 291 191 193 269 144"
      [attr.stroke]="'url(#' + id + '-edge)'"
      stroke-width=".8"
      stroke-opacity=".65"
      stroke-linecap="round"
    />
    <g class="floating-pearl">
      <circle cx="444" cy="166" r="9" [attr.fill]="'url(#' + id + '-pearl)'" />
      <ellipse cx="441.5" cy="162.5" rx="2.8" ry="1.6" fill="#ffffed" opacity=".75" />
      <circle cx="444" cy="166" r="15" stroke="#d8e5b8" stroke-opacity=".35" />
    </g>
  </g>
  <g fill="currentColor" opacity=".55">
    <circle cx="87" cy="237" r="2" />
    <circle cx="513" cy="237" r="2" />
  </g>
</svg>
