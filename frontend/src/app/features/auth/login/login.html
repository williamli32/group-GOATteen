<div class="auth-page">

  <!-- Background decoration -->
  <div class="background-glow background-glow-left"></div>
  <div class="background-glow background-glow-right"></div>

  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <span></span>
        <span></span>
      </div>

      <span class="brand-name">APEXTRADE</span>
    </div>

    <div class="tagline">
      Trade Smarter. Go Further.
    </div>
  </header>

  <!-- Main -->
  <main class="auth-main">

    <section class="auth-card">

      <div class="card-heading">
        <div class="eyebrow">APEXTRADE</div>

        <h1>Welcome back</h1>

        <p>Sign in to your trading terminal</p>
      </div>

      <!-- Authentication mode -->
      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
        >
          Sign In
        </button>

        <button
          type="button"
          class="auth-tab"
          routerLink="/register"
        >
          Sign Up
        </button>

      </div>

      <!-- Login form -->
      <form
        class="login-form"
        (ngSubmit)="login($event)"
      >

        <!-- Email -->
        <div class="form-field">

          <label for="email">
            Email
          </label>

          <div class="input-wrapper">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path
                d="m3 7 9 6 9-6"
              ></path>
            </svg>

            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              placeholder="you@firm.com"
              autocomplete="email"
              required
            />

          </div>

        </div>

        <!-- Password -->
        <div class="form-field">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect
                x="5"
                y="10"
                width="14"
                height="10"
                rx="2"
              ></rect>

              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
              ></path>

            </svg>

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >

              @if (showPassword) {

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                  <path d="M9.9 4.3A10.7 10.7 0 0 1 12 4c5 0 8.5 4 9.5 6a12.7 12.7 0 0 1-3.1 3.7"></path>
                  <path d="M6.6 6.6C4.6 8 3.3 9.7 2.5 10.8c1 2 4.5 6.2 9.5 6.2 1.3 0 2.5-.3 3.5-.7"></path>
                </svg>

              } @else {

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                  ></path>

                  <circle
                    cx="12"
                    cy="12"
                    r="2.5"
                  ></circle>
                </svg>

              }

            </button>

          </div>

        </div>

        <!-- Error -->
        @if (errorMessage) {
          <div class="login-error">
            {{ errorMessage }}
          </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          class="submit-button"
          [disabled]="loading"
        >
          @if (loading) {
            <span class="spinner"></span>
            Signing in...
          } @else {
            Access Terminal
          }
        </button>

      </form>

      <!-- Secondary action -->
      <button
        type="button"
        class="forgot-password"
      >
        Forgot password?
      </button>

      <div class="security-note">
        <span class="security-dot"></span>
        Secure access to your trading account
      </div>

    </section>

  </main>

  <!-- Bottom left -->
  <div class="corner-text corner-left">
    <div class="corner-line"></div>
    <span>GLOBAL MARKETS</span>
    <span>REAL OPPORTUNITIES</span>
  </div>

  <!-- Bottom right -->
  <div class="corner-text corner-right">

    <div class="chart-icon">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div>
      <span style="display:block;">SECURE</span>
      <span style="display:block;">RELIABLE</span>
      <span style="display:block;">BUILT FOR TRADERS</span>
    </div>

  </div>

</div>
