<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>G.O.A.T. — Trading workspace</title>
    <meta name="theme-color" content="#172e25" />
    <script>
      // Apply the theme before styles render, including when storage is blocked.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('goatteen-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#101b18' : '#f5f6f3');
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
