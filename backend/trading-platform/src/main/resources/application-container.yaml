spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    redirect-context-root: false

app:
  auth:
    internal-access-code: ${INTERNAL_ACCESS_CODE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8082}
  market-simulator:
    base-url: ${MARKET_DATA_URL:http://market-data-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
