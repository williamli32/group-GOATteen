spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 10s

app:
  price-alerts:
    enabled: false

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15

  auth:
    internal-access-code: integration-test-staff-code
    refresh-token-expiration-days: 7

  market-simulator:
    enabled: false

  recovery:
    enabled: false

  reporting:
    backfill-enabled: false
