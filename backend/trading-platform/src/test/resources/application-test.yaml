spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15

  auth:
    refresh-token-expiration-days: 7

  market-simulator:
    enabled: false

  recovery:
    enabled: false